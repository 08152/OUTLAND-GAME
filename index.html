
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OUTLAND</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080d14;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
}

.background {
    position: fixed;
    inset: 0;
    background:
        linear-gradient(90deg, rgba(3,8,14,.94), rgba(3,8,14,.58)),
        linear-gradient(0deg, rgba(3,8,14,.85), transparent),
        url("https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=2200&q=90");
    background-size: cover;
    background-position: center;
}

.grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .12;
    background-image:
        linear-gradient(rgba(100,160,200,.2) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100,160,200,.2) 1px, transparent 1px);
    background-size: 55px 55px;
}

header {
    position: relative;
    z-index: 5;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    border-bottom: 1px solid rgba(150,190,220,.15);
    background: rgba(3,8,14,.45);
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 5px;
}

.logo span {
    color: #56baff;
}

nav {
    display: flex;
    gap: 32px;
}

nav button {
    background: none;
    border: none;
    color: #aebdca;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: .2s;
}

nav button:hover,
nav button.active {
    color: #56baff;
}

.player {
    border: 1px solid rgba(86,186,255,.4);
    padding: 10px 16px;
    font-size: 11px;
    letter-spacing: 2px;
    color: #b9dfff;
}

/* LOBBY */

.content {
    position: absolute;
    z-index: 2;
    top: 25vh;
    left: 9%;
    max-width: 490px;
}

.small-title {
    color: #56baff;
    font-size: 12px;
    letter-spacing: 4px;
    margin-bottom: 20px;
}

h1 {
    font-size: clamp(55px, 7vw, 90px);
    font-weight: 900;
    letter-spacing: 5px;
    line-height: 1;
    text-shadow: 0 5px 30px #000;
}

.line {
    width: 100px;
    height: 3px;
    background: #56baff;
    margin: 28px 0;
    box-shadow: 0 0 15px #56baff;
}

.description {
    color: #b5c0ca;
    font-size: 15px;
    line-height: 1.7;
    max-width: 400px;
}

.play-button {
    margin-top: 35px;
    padding: 17px 55px;
    background: #56baff;
    color: #06111c;
    border: none;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 4px;
    cursor: pointer;
    transform: skew(-8deg);
    transition: .25s;
}

.play-button:hover {
    background: white;
    box-shadow: 0 0 30px rgba(86,186,255,.5);
}

/* 3D CHARAKTER */

.character-preview {
    position: absolute;
    z-index: 1;
    right: 4%;
    top: 95px;
    bottom: 0;
    width: 49%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

#characterCanvas {
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: auto;
    cursor: grab;
    touch-action: none;
}

#characterCanvas:active {
    cursor: grabbing;
}

.character-label {
    position: absolute;
    bottom: 55px;
    right: 8%;
    color: rgba(160,205,235,.65);
    font-size: 10px;
    letter-spacing: 3px;
    pointer-events: none;
}

/* ANDERE MENÜS */

.screen {
    display: none;
    position: absolute;
    z-index: 3;
    top: 25vh;
    left: 9%;
}

.screen h2 {
    font-size: 55px;
    letter-spacing: 5px;
}

.screen .line {
    margin: 25px 0;
}

.back-button {
    margin-top: 35px;
    padding: 13px 30px;
    color: white;
    background: rgba(10,20,30,.7);
    border: 1px solid #56baff;
    letter-spacing: 2px;
    cursor: pointer;
}

.back-button:hover {
    background: #56baff;
    color: #06111c;
}

.version {
    position: fixed;
    bottom: 25px;
    right: 35px;
    z-index: 5;
    color: #8293a3;
    font-size: 10px;
    letter-spacing: 3px;
}

.corner {
    position: fixed;
    width: 35px;
    height: 35px;
    border-color: #56baff;
    opacity: .6;
    z-index: 6;
    pointer-events: none;
}

.tl {
    top: 20px;
    left: 20px;
    border-top: 1px solid;
    border-left: 1px solid;
}

.tr {
    top: 20px;
    right: 20px;
    border-top: 1px solid;
    border-right: 1px solid;
}

.bl {
    bottom: 20px;
    left: 20px;
    border-bottom: 1px solid;
    border-left: 1px solid;
}

.br {
    bottom: 20px;
    right: 20px;
    border-bottom: 1px solid;
    border-right: 1px solid;
}

@media(max-width: 850px) {
    header {
        padding: 0 5%;
    }

    nav {
        gap: 12px;
    }

    nav button {
        font-size: 9px;
        letter-spacing: 1px;
    }

    .player {
        display: none;
    }

    .content {
        top: 20vh;
        left: 7%;
    }

    .character-preview {
        right: -15%;
        width: 85%;
        opacity: .35;
    }

    .description {
        max-width: 300px;
    }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="grid"></div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<header>

    <div class="logo">OUT<span>LAND</span></div>

    <nav>
        <button onclick="openScreen('spind', this)">SPIND</button>
        <button class="active" onclick="openScreen('lobby', this)">SPIELEN</button>
        <button onclick="openScreen('geister', this)">GEISTER</button>
        <button onclick="openScreen('shop', this)">SHOP</button>
    </nav>

    <div class="player">01 &nbsp; SPIELER</div>

</header>

<main>

    <!-- LOBBY -->

    <section class="content" id="lobby">

        <div class="small-title">
            BATTLE ROYALE // LOBBY
        </div>

        <h1>OUTLAND</h1>

        <div class="line"></div>

        <p class="description">
            Betritt die Welt. Erkunde die Insel.
            Stelle dich der Herausforderung.
        </p>

        <button class="play-button"
                onclick="location.href='game.html'">
            SPIELEN
        </button>

    </section>

    <!-- 3D CHARAKTER -->

    <div class="character-preview" id="characterPreview">
        <canvas id="characterCanvas"></canvas>
        <div class="character-label">
            CHARACTER PREVIEW
        </div>
    </div>

    <!-- SPIND -->

    <section class="screen" id="spind">
        <div class="small-title">DEINE SAMMLUNG</div>
        <h2>SPIND</h2>
        <div class="line"></div>
        <button class="back-button" onclick="openScreen('lobby')">
            ZURÜCK
        </button>
    </section>

    <!-- GEISTER -->

    <section class="screen" id="geister">
        <div class="small-title">ENTDECKE DIE WELT</div>
        <h2>GEISTER</h2>
        <div class="line"></div>
        <button class="back-button" onclick="openScreen('lobby')">
            ZURÜCK
        </button>
    </section>

    <!-- SHOP -->

    <section class="screen" id="shop">
        <div class="small-title">OUTLAND</div>
        <h2>SHOP</h2>
        <div class="line"></div>
        <button class="back-button" onclick="openScreen('lobby')">
            ZURÜCK
        </button>
    </section>

</main>

<div class="version">VERSION 0.1.0</div>

<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- DEIN CHARAKTER -->

<script src="character.js"></script>

<script>

// ===========================================
// MENÜ
// ===========================================

function openScreen(name, button) {

    document.querySelectorAll('.content, .screen')
        .forEach(screen => {
            screen.style.display = 'none';
        });

    document.getElementById(name).style.display = 'block';

    const preview = document.getElementById('characterPreview');

    preview.style.display =
        name === 'lobby' ? 'flex' : 'none';

    document.querySelectorAll('nav button')
        .forEach(btn => btn.classList.remove('active'));

    if (button) {
        button.classList.add('active');
    } else {
        document.querySelectorAll('nav button').forEach(btn => {
            if (btn.textContent.trim() === 'SPIELEN') {
                btn.classList.add('active');
            }
        });
    }
}


// ===========================================
// THREE.JS SZENE
// ===========================================

const canvas = document.getElementById('characterCanvas');

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    35,
    1,
    0.1,
    100
);

camera.position.set(3.2, 2.5, 5.5);

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    alpha: true,
    antialias: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;


// ===========================================
// BELEUCHTUNG
// ===========================================

const ambient = new THREE.HemisphereLight(
    0xffffff,
    0x263448,
    2
);

scene.add(ambient);

const mainLight = new THREE.DirectionalLight(
    0xffffff,
    3
);

mainLight.position.set(3, 7, 5);
mainLight.castShadow = true;
scene.add(mainLight);

const blueLight = new THREE.PointLight(
    0x369bff,
    30,
    12
);

blueLight.position.set(-3, 2, -2);
scene.add(blueLight);


// ===========================================
// BODEN
// ===========================================

const groundGeometry = new THREE.CircleGeometry(1.3, 64);

const groundMaterial = new THREE.MeshStandardMaterial({
    color: 0x152332,
    roughness: 0.9,
    metalness: 0.1
});

const ground = new THREE.Mesh(
    groundGeometry,
    groundMaterial
);

ground.rotation.x = -Math.PI / 2;
ground.position.y = 0;
ground.receiveShadow = true;

scene.add(ground);


// Dezenter blauer Ring

const ring = new THREE.Mesh(
    new THREE.RingGeometry(1.25, 1.27, 96),
    new THREE.MeshBasicMaterial({
        color: 0x56baff,
        transparent: true,
        opacity: 0.5,
        side: THREE.DoubleSide
    })
);

ring.rotation.x = -Math.PI / 2;
ring.position.y = 0.01;

scene.add(ring);


// ===========================================
// CHARAKTER LADEN
// ===========================================

let player = null;

if (typeof createOUTLANDCharacter === 'function') {

    player = createOUTLANDCharacter(scene);

    player.root.position.set(0, 0, 0);

    // Vorderseite des Charakters zeigt zur Kamera.
    player.root.rotation.y = 0;

} else {

    console.error(
        "OUTLAND: character.js konnte nicht geladen werden!"
    );
}


// Kamera auf den Charakter ausrichten

camera.lookAt(0, 1.45, 0);


// ===========================================
// MAUSSTEUERUNG
// ===========================================

let dragging = false;
let previousX = 0;

canvas.addEventListener('pointerdown', event => {

    dragging = true;
    previousX = event.clientX;

    canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener('pointermove', event => {

    if (!dragging || !player) return;

    const difference = event.clientX - previousX;

    player.root.rotation.y += difference * 0.008;

    previousX = event.clientX;
});

canvas.addEventListener('pointerup', () => {
    dragging = false;
});

canvas.addEventListener('pointercancel', () => {
    dragging = false;
});


// ===========================================
// GRÖSSE ANPASSEN
// ===========================================

function resizeCharacter() {

    const width = canvas.clientWidth;
    const height = canvas.clientHeight;

    if (!width || !height) return;

    renderer.setSize(width, height, false);

    camera.aspect = width / height;
    camera.updateProjectionMatrix();
}

const resizeObserver = new ResizeObserver(resizeCharacter);

resizeObserver.observe(canvas);

resizeCharacter();


// ===========================================
// RENDER LOOP
// ===========================================

function animate() {

    requestAnimationFrame(animate);

    // Keine Charakteranimationen.
    // Das Modell bleibt statisch.

    renderer.render(scene, camera);
}

animate();

</script>

</body>
</html>
